<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/organic-7222ddcd-a407-42be-a11e-091d1d199ee6/styles.css">
  <script src="_ds/organic-7222ddcd-a407-42be-a11e-091d1d199ee6/_ds_bundle.js"></script>
  <style>
    html, body { margin: 0; background: var(--color-bg); overflow-x: hidden; }
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes flower-in {
      0% { transform: scale(0) rotate(-35deg); opacity: 0; }
      60% { transform: scale(1.15) rotate(8deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes burst-particle {
      0% { transform: translate(-50%, -50%) translate(0, 0) scale(0); opacity: 1; }
      65% { opacity: 1; }
      100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
    }
    @keyframes fade-up { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes pulse-heart { 0%, 100% { transform: scale(1) rotate(-45deg); } 50% { transform: scale(1.12) rotate(-45deg); } }
    @keyframes gradient-shift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    @keyframes slide-in-left { from { transform: translateX(-160%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slide-in-right { from { transform: translateX(160%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slide-in-top { from { transform: translateY(-160%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slide-in-bottom { from { transform: translateY(160%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes rotate-in { from { transform: rotate(0deg); } to { transform: rotate(var(--rot-to)); } }
  </style>
</helmet>

<div style="background: var(--color-bg); position: relative;">
  <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="5">
    <section
      ref="{{ sec.setRef }}"
      data-screen-label="{{ sec.label }}"
      style="height: 100vh; height: 100svh; min-height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: {{ sec.bg }}; animation: {{ sec.bgAnim }};"
    >
      <sc-if value="{{ sec.hasWaves }}" hint-placeholder-val="{{ false }}">
        <svg viewBox="0 0 1200 90" preserveAspectRatio="none" style="position: absolute; top: 0; left: 0; width: 100%; height: 90px; z-index: 1; pointer-events: none; display: block;">
          <path d="M0,40 C200,90 400,0 600,45 C800,90 1000,10 1200,50 L1200,0 L0,0 Z" style="fill: var(--color-bg);"></path>
        </svg>
        <svg viewBox="0 0 1200 90" preserveAspectRatio="none" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 90px; z-index: 1; pointer-events: none; display: block; transform: rotate(180deg);">
          <path d="M0,40 C200,90 400,0 600,45 C800,90 1000,10 1200,50 L1200,0 L0,0 Z" style="fill: var(--color-bg);"></path>
        </svg>
      </sc-if>
      <sc-if value="{{ sec.showDecor }}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; pointer-events: none;">
          <sc-if value="{{ sec.isFlower }}" hint-placeholder-val="{{ false }}">
            <sc-for list="{{ sec.flowers }}" as="fl" hint-placeholder-count="8">
              <div style="position: absolute; top: {{ fl.top }}%; left: {{ fl.left }}%; width: 190px; height: 190px; transform: translate(-50%, -50%) scale({{ fl.scale }}); animation: spin-slow {{ fl.duration }}s linear infinite, flower-in 0.9s ease-out {{ fl.delay }}s both;">
                <sc-for list="{{ sec.petals }}" as="p" hint-placeholder-count="6">
                  <div style="position: absolute; top: 50%; left: 50%; width: 42px; height: 92px; border-radius: 50%; background: {{ p.color }}; transform-origin: 50% 0%; transform: translate(-50%, 0) rotate({{ p.angle }}deg) translateY(6px); opacity: 1;"></div>
                </sc-for>
                <div style="position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; border-radius: 50%; background: var(--color-accent-700); transform: translate(-50%, -50%);"></div>
              </div>
            </sc-for>
          </sc-if>
          <sc-if value="{{ sec.isLeaves }}" hint-placeholder-val="{{ false }}">
            <sc-for list="{{ sec.leaves }}" as="lf" hint-placeholder-count="10">
              <div style="position: absolute; {{ lf.posDecl }} width: {{ lf.size }}px; height: {{ lf.size }}px; animation: {{ lf.slideAnim }} 1.1s ease-out {{ lf.delay }}s both;">
                <div style="width: 100%; height: 160%; background: {{ lf.color }}; border-radius: 0% 70% 0% 70%; transform-origin: bottom center; --rot-to: {{ lf.rotate }}deg; animation: rotate-in 1.1s ease-out {{ lf.delay }}s both;"></div>
              </div>
            </sc-for>
          </sc-if>
          <sc-if value="{{ sec.isBurst }}" hint-placeholder-val="{{ false }}">
            <div style="position: relative; width: 10px; height: 10px;">
              <sc-for list="{{ sec.particles }}" as="pt" hint-placeholder-count="24">
                <div style="position: absolute; top: 50%; left: 50%; width: {{ pt.size }}px; height: {{ pt.size }}px; border-radius: 50%; background: {{ pt.color }}; --tx: {{ pt.tx }}px; --ty: {{ pt.ty }}px; animation: burst-particle 1.15s cubic-bezier(0.2,0.7,0.3,1) {{ pt.delay }}s both;"></div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ sec.isGrand }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; width: 26px; height: 26px; background: var(--color-accent-2-500); transform: rotate(-45deg); animation: pulse-heart 1.6s ease-in-out 0.6s infinite;" style-before="content:''; position:absolute; width:26px; height:26px; border-radius:50%; background:var(--color-accent-2-500); top:-13px; left:0;" style-after="content:''; position:absolute; width:26px; height:26px; border-radius:50%; background:var(--color-accent-2-500); top:0; left:13px;"></div>
          </sc-if>
        </div>
      </sc-if>
      <div style="position: relative; z-index: 2; text-align: center; max-width: 720px; padding: 0 32px; opacity: {{ sec.textOpacity }}; transform: translateY({{ sec.textShift }}px); transition: opacity 0.9s ease, transform 0.9s ease;">
        <div style="font-family: var(--font-body); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.95rem; color: var(--color-accent-700); margin-bottom: 18px;">{{ sec.tag }}</div>
        <h2 style="font-family: var(--font-heading); font-size: clamp(2.2rem, 5vw, 4rem); line-height: 1.15; color: var(--color-text); margin: 0; text-wrap: pretty;">{{ sec.message }}</h2>
      </div>
      <sc-if value="{{ sec.showScrollCue }}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--color-accent-700); font-family: var(--font-body); font-size: 0.85rem; letter-spacing: 0.05em; animation: bob 2s ease-in-out infinite;">
          <span>keep scrolling</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </sc-if>
    </section>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;flowerCount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:16,&quot;min&quot;:1,&quot;max&quot;:16,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Effects&quot;},&quot;flowerSpread&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.9,&quot;min&quot;:0.1,&quot;max&quot;:1.6,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Effects&quot;},&quot;fireworkCount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:34,&quot;min&quot;:6,&quot;max&quot;:60,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Effects&quot;},&quot;fireworkSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.4,&quot;min&quot;:0.3,&quot;max&quot;:2.5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Effects&quot;},&quot;fireworkSpread&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.3,&quot;max&quot;:2.5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Effects&quot;},&quot;page1Tag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rise and shine&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page 1&quot;},&quot;page1Message&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Good morning, beautiful.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page 1&quot;},&quot;page2Tag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dr Lemon&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page 2&quot;},&quot;page2Message&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Has risen to conquer another day&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page 2&quot;},&quot;page3Tag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;This lemon has barely showed me the country smh&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page 3&quot;},&quot;page3Message&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;May you have the most beautifuly splendid of days&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page 3&quot;},&quot;page4Tag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;I miss you so mush you goofy goober&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page 4&quot;},&quot;page4Message&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;I hope you're having soooooo much fun&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page 4&quot;},&quot;page5Tag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Always&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page 5&quot;},&quot;page5Message&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;I love you.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page 5&quot;}}">
function makeParticles(n, palette, sizeMult, spreadMult) {
  const sm = sizeMult == null ? 1 : sizeMult;
  const sp = spreadMult == null ? 1 : spreadMult;
  const arr = [];
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.35;
    const dist = (110 + Math.random() * 170) * sp;
    arr.push({
      tx: Math.round(Math.cos(angle) * dist),
      ty: Math.round(Math.sin(angle) * dist),
      delay: Math.round(Math.random() * 150) / 1000,
      size: Math.round((6 + Math.random() * 9) * sm),
      color: palette[Math.floor(Math.random() * palette.length)],
    });
  }
  return arr;
}

const ACCENT_PALETTE = ['var(--color-accent-500)', 'var(--color-accent-600)', 'var(--color-accent-300)'];
const SAGE_PALETTE = ['var(--color-accent-2-500)', 'var(--color-accent-2-600)', 'var(--color-accent-2-300)'];
const MIX_PALETTE = ACCENT_PALETTE.concat(SAGE_PALETTE);

const RAW_SECTIONS = [
  { tag: 'Rise and shine', message: 'Good morning, beautiful.', type: 'flower', flowerPalette: ACCENT_PALETTE },
  { tag: 'First thing', message: 'You crossed my mind before my alarm did.', type: 'burst', palette: SAGE_PALETTE },
  { tag: 'Today', message: "Whatever the day brings, you've got this.", type: 'leaves', palette: SAGE_PALETTE },
  { tag: 'Reminder', message: 'You are so loved.', type: 'burst', palette: ACCENT_PALETTE },
  { tag: 'Always', message: 'Good morning, always.', type: 'grand', palette: MIX_PALETTE },
];

const PETALS = [0, 1, 2, 3, 4, 5];

function makeLeaves(count, palette) {
  const arr = [];
  const edges = ['left', 'right', 'top', 'bottom'];
  const perEdge = Math.ceil(count / 4);
  let i = 0;
  edges.forEach((edge) => {
    for (let j = 0; j < perEdge && i < count; j++, i++) {
      const size = Math.round(30 + Math.random() * 34);
      const length = size * 1.6;
      const clipFrac = 0.25;
      let posDecl, slideAnim, rotate, proj, offEdge;
      if (edge === 'left') {
        rotate = Math.round(35 + Math.random() * 45);
        proj = Math.abs(Math.sin((rotate * Math.PI) / 180));
        offEdge = Math.round(-clipFrac * length * proj);
        posDecl = 'top: ' + Math.round(2 + Math.random() * 96) + '%; left: ' + offEdge + 'px;';
        slideAnim = 'slide-in-left';
      } else if (edge === 'right') {
        rotate = -Math.round(35 + Math.random() * 45);
        proj = Math.abs(Math.sin((rotate * Math.PI) / 180));
        offEdge = Math.round(-clipFrac * length * proj);
        posDecl = 'top: ' + Math.round(2 + Math.random() * 96) + '%; right: ' + offEdge + 'px;';
        slideAnim = 'slide-in-right';
      } else if (edge === 'top') {
        rotate = 180 + Math.round(-20 + Math.random() * 40);
        proj = Math.abs(Math.cos((rotate * Math.PI) / 180));
        offEdge = Math.round(-clipFrac * length * proj);
        posDecl = 'left: ' + Math.round(2 + Math.random() * 96) + '%; top: ' + offEdge + 'px;';
        slideAnim = 'slide-in-top';
      } else {
        rotate = Math.round(-20 + Math.random() * 40);
        proj = Math.abs(Math.cos((rotate * Math.PI) / 180));
        offEdge = Math.round(-clipFrac * length * proj);
        posDecl = 'left: ' + Math.round(2 + Math.random() * 96) + '%; bottom: ' + offEdge + 'px;';
        slideAnim = 'slide-in-bottom';
      }
      arr.push({
        posDecl,
        slideAnim,
        size,
        rotate,
        delay: Math.round(Math.random() * 500) / 1000,
        color: palette[Math.floor(Math.random() * palette.length)],
      });
    }
  });
  return arr;
}



function makeFlowerLayout(count, spread) {
  const jitter = spread == null ? 0.4 : spread;
  const cols = Math.ceil(Math.sqrt(count * 1.4));
  const rows = Math.ceil(count / cols);
  const cellW = 100 / cols;
  const cellH = 100 / rows;
  const arr = [];
  for (let i = 0; i < count; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    let top = (row + 0.5) * cellH + (Math.random() - 0.5) * cellH * jitter;
    let left = (col + 0.5) * cellW + (Math.random() - 0.5) * cellW * jitter;
    const scale = Math.round((0.2 + Math.random() * 0.25) * 100) / 100;
    const pad = 14 + scale * 30;
    const cTop = [24 - pad * 0.4, 76 + pad * 0.4];
    const cLeft = [12 - pad * 0.6, 88 + pad * 0.6];
    if (top > cTop[0] && top < cTop[1] && left > cLeft[0] && left < cLeft[1]) {
      const dTop = top - cTop[0];
      const dBottom = cTop[1] - top;
      const dLeft = left - cLeft[0];
      const dRight = cLeft[1] - left;
      const min = Math.min(dTop, dBottom, dLeft, dRight);
      if (min === dTop) top = cTop[0] - pad;
      else if (min === dBottom) top = cTop[1] + pad;
      else if (min === dLeft) left = cLeft[0] - pad;
      else left = cLeft[1] + pad;
    }
    arr.push({
      top: Math.round(Math.min(96, Math.max(4, top))),
      left: Math.round(Math.min(98, Math.max(2, left))),
      scale,
      duration: Math.round((10 + Math.random() * 12) * 10) / 10,
      delay: Math.round(Math.random() * 400) / 1000,
    });
  }
  return arr;
}

class Component extends DCLogic {
  state = { active: 0 };
  refs = [];

  componentDidMount() {
    this.observer = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && e.intersectionRatio > 0.55) {
          const idx = Number(e.target.dataset.idx);
          if (idx !== this.state.active) this.setState({ active: idx });
        }
      });
    }, { threshold: [0.55] });
    this.refs.forEach((r) => r && this.observer.observe(r));
  }

  componentWillUnmount() {
    if (this.observer) this.observer.disconnect();
  }

  setRef(i) {
    return (el) => {
      this.refs[i] = el;
      if (el) {
        el.dataset.idx = i;
        if (this.observer) this.observer.observe(el);
      }
    };
  }

  renderVals() {
    const active = this.state.active;
    const petalColors = (palette) => PETALS.map((i) => ({ angle: i * 60, color: palette[i % palette.length] }));

    const sections = RAW_SECTIONS.map((s, i) => {
      const isActive = active === i;
      const n = i + 1;
      return {
        idx: i,
        label: 'Section ' + n,
        tag: this.props['page' + n + 'Tag'] ?? s.tag,
        message: this.props['page' + n + 'Message'] ?? s.message,
        textOpacity: isActive ? 1 : 0,
        textShift: isActive ? 0 : 22,
        showDecor: isActive,
        isFlower: s.type === 'flower',
        isBurst: s.type === 'burst',
        isGrand: s.type === 'grand',
        isLeaves: s.type === 'leaves',
        leaves: s.type === 'leaves' ? makeLeaves(46, s.palette) : [],
        particles: s.type === 'burst' || s.type === 'grand'
          ? makeParticles(
              (this.props.fireworkCount ?? 24) + (s.type === 'grand' ? 10 : 0),
              s.palette,
              this.props.fireworkSize ?? 1,
              this.props.fireworkSpread ?? 1
            )
          : [],
        petals: s.type === 'flower' ? petalColors(s.flowerPalette) : [],
        flowers: s.type === 'flower' ? makeFlowerLayout(this.props.flowerCount ?? 8, i === 0 ? (this.props.flowerSpread ?? 0.4) : 0.4) : [],
        showScrollCue: i === 0,
        bg: (i === 1 || i === 3)
          ? 'linear-gradient(120deg, var(--color-bg), var(--color-accent-200), var(--color-accent-2-200), var(--color-bg)) 0% 0% / 300% 300%'
          : 'var(--color-bg)',
        bgAnim: (i === 1 || i === 3) ? 'gradient-shift 10s ease-in-out infinite' : 'none',
        hasWaves: i === 1 || i === 3,
        setRef: this.setRef(i),
      };
    });

    return { sections };
  }
}

</script>
</body>
</html>
